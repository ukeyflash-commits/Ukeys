
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Адаптивность для мобильных устройств -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оформление заказа | UKeys</title>

    <style>
        /* ============================================================
           СБРОС СТИЛЕЙ И БАЗОВЫЕ НАСТРОЙКИ
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Градиентный фон страницы */
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        /* Основной белый контейнер по центру экрана */
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 25px;
            font-size: 28px;
        }

        h2 {
            color: #444;
            margin: 25px 0 15px 0;
            font-size: 22px;
            /* Фиолетовая линия под заголовком */
            border-bottom: 2px solid #667eea;
            padding-bottom: 8px;
        }

        /* ============================================================
           БЛОК ТОВАРОВ (список доступных товаров)
           ============================================================ */
        .product-item {
            border: 1px solid #e0e0e0;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            transition: all 0.3s;
            background: #f8f9fa;
        }

        /* Подсветка товара при наведении */
        .product-item:hover {
            border-color: #667eea;
            background: #f0f2ff;
        }

        .product-item .product-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .product-item .product-name {
            font-weight: 600;
            font-size: 16px;
            color: #333;
        }

        .product-item .product-price {
            color: #667eea;
            font-weight: bold;
        }

        /* Кнопка «Добавить» у каждого товара */
        .product-item button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            white-space: nowrap;
        }

        /* Эффект наведения только если кнопка активна */
        .product-item button:hover:not(:disabled) {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        /* Кнопка в состоянии «уже в корзине» */
        .product-item button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        /* ============================================================
           БЛОК КОРЗИНЫ (добавленные товары)
           ============================================================ */
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* Убираем линию у последнего элемента корзины */
        .cart-item:last-child {
            border-bottom: none;
        }

        .cart-item .item-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .cart-item .item-name {
            font-weight: 500;
        }

        .cart-item .item-price {
            color: #667eea;
            font-weight: bold;
        }

        /* Блок с количеством и кнопкой удаления */
        .cart-item .item-quantity {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Кнопка удаления товара из корзины */
        .cart-item .remove-btn {
            background: #e53e3e;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .cart-item .remove-btn:hover {
            background: #c53030;
        }

        /* Заглушка «Корзина пуста» */
        .cart-empty {
            color: #999;
            text-align: center;
            padding: 30px 0;
            font-size: 16px;
        }

        /* Итоговая сумма */
        .total {
            font-size: 26px;
            font-weight: bold;
            color: #2ecc71;
            text-align: right;
            padding: 15px 0;
            border-top: 2px solid #eee;
            margin-top: 10px;
        }

        /* Кнопки под корзиной (очистить) */
        .cart-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 15px 0;
        }

        .cart-actions button {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .cart-actions .clear-btn {
            background: #e53e3e;
            color: white;
        }

        .cart-actions .clear-btn:hover {
            background: #c53030;
        }

        /* ============================================================
           ФОРМА ОФОРМЛЕНИЯ ЗАКАЗА
           ============================================================ */
        .order-form {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 2px solid #eee;
        }

        .order-form h2 {
            margin-top: 0;
        }

        .order-form .form-group {
            margin-bottom: 18px;
        }

        .order-form label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
            font-size: 14px;
        }

        /* Поля ввода и textarea */
        .order-form input,
        .order-form textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
            font-family: inherit;
        }

        /* Подсветка поля при фокусе */
        .order-form input:focus,
        .order-form textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .order-form textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* Главная зелёная кнопка отправки */
        .order-form .submit-btn {
            width: 100%;
            padding: 16px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .order-form .submit-btn:hover {
            background: #218838;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
        }

        /* Кнопка в состоянии «отправка...» */
        .order-form .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Ссылка «На главную» */
        .back-link {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 30px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.3s;
            font-weight: 500;
        }

        .back-link:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        /* ============================================================
           ВСПЛЫВАЮЩИЕ УВЕДОМЛЕНИЯ (внизу справа)
           ============================================================ */
        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #333;
            color: white;
            padding: 14px 24px;
            border-radius: 12px;
            z-index: 2000;
            animation: slideIn 0.3s ease;
            max-width: 340px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }

        .notification.success {
            background: #28a745;
        }

        .notification.error {
            background: #e53e3e;
        }

        /* Анимация выезда уведомления справа */
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* ============================================================
           МОБИЛЬНАЯ АДАПТАЦИЯ
           ============================================================ */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 16px;
                border-radius: 15px;
            }

            h1 {
                font-size: 22px;
            }

            h2 {
                font-size: 18px;
            }

            .product-item {
                flex-direction: column;
                align-items: stretch;
                padding: 12px;
            }

            .product-item button {
                width: 100%;
                text-align: center;
                padding: 12px;
            }

            .cart-item {
                flex-direction: column;
                align-items: stretch;
                padding: 12px 0;
                gap: 8px;
            }

            .cart-item .item-info {
                justify-content: space-between;
            }

            .cart-item .item-quantity {
                justify-content: space-between;
            }

            .cart-item .remove-btn {
                width: 100%;
                padding: 8px;
                text-align: center;
            }

            .total {
                font-size: 22px;
                text-align: center;
            }

            .cart-actions {
                flex-direction: column;
            }

            .cart-actions button {
                width: 100%;
                text-align: center;
            }

            .order-form input,
            .order-form textarea {
                font-size: 15px;
                padding: 10px 12px;
            }

            .order-form .submit-btn {
                font-size: 16px;
                padding: 14px;
            }

            .back-link {
                display: block;
                text-align: center;
            }

            .notification {
                left: 10px;
                right: 10px;
                bottom: 10px;
                max-width: none;
                font-size: 14px;
                padding: 12px 16px;
            }
        }

        @media (max-width: 400px) {
            .container {
                padding: 12px;
            }

            h1 {
                font-size: 20px;
            }

            .product-item .product-name {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================================
         МОДАЛЬНОЕ ОКНО С QR-КОДОМ
         Скрыто по умолчанию (display:none).
         Показывается из JS через showQrModal() -> display:flex.
         Закрывается кликом по крестику или по тёмному фону.
         ============================================================ -->
    <div id="qrModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:3000; align-items:center; justify-content:center; padding:15px;">
        <div style="background:#1e1e1e; color:white; padding:30px; border-radius:15px; max-width:360px; width:100%; text-align:center; position:relative;">

            <!-- Кнопка закрытия (крестик) -->
            <button id="qrModalClose" style="position:absolute; top:10px; right:15px; background:none; border:none; color:white; font-size:28px; line-height:1; cursor:pointer;">&times;</button>

            <h2 style="color:#4CAF50; margin-top:0;">Заказ оформлен!</h2>
            <p>Номер заказа: <strong id="qrModalInvId"></strong></p>
            <p>Отсканируйте QR-код в приложении банка:</p>

            <!-- Картинка QR-кода; src подставляется из ответа сервера -->
            <img id="qrModalImg" src="" alt="QR-код"
                 style="width:250px; height:250px; border-radius:10px; background:white; padding:10px; margin:15px 0;">

            <p style="color:#ef5350; font-size:14px;">
                После оплаты мы вышлем вам ссылку на ваши файлы на вашу почту.
            </p>
        </div>
    </div>

    <!-- ============================================================
         ОСНОВНОЙ КОНТЕЙНЕР СТРАНИЦЫ
         ============================================================ -->
    <div class="container">
        <h1>🛒 Оформление заказа</h1>

        <!-- ---------- БЛОК ТОВАРОВ ----------
             Список товаров рендерится из JS в этот div. -->
        <h2>📦 Товары</h2>
        <div id="products"></div>

        <!-- ---------- БЛОК КОРЗИНЫ ----------
             Содержимое корзины рендерится из JS. -->
        <h2>🛍️ Корзина</h2>
        <div id="cart">
            <p class="cart-empty">Корзина пуста</p>
        </div>

        <!-- Итоговая сумма -->
        <div id="total" class="total">Итого: 0 ₽</div>

        <!-- Кнопка очистки корзины -->
        <div class="cart-actions">
            <button class="clear-btn" onclick="clearCart()">🗑️ Очистить корзину</button>
        </div>

        <!-- ---------- ФОРМА ЗАКАЗА ---------- -->
        <div class="order-form">
            <h2>📝 Данные для заказа</h2>
            <form id="orderForm">
                <div class="form-group">
                    <label for="name">Ваше имя *</label>
                    <input type="text" id="name" placeholder="Иван Иванов" required>
                </div>
                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" placeholder="ivan@example.com" required>
                </div>
                <div class="form-group">
                    <label for="phone">Телефон *</label>
                    <input type="tel" id="phone" placeholder="+7 (999) 123-45-67" required>
                </div>
                <div class="form-group">
                    <label for="comment">Комментарий к заказу</label>
                    <textarea id="comment" placeholder="Дополнительная информация..." rows="3"></textarea>
                </div>
                <button type="submit" class="submit-btn">✅ Отправить заказ</button>
            </form>
        </div>

        <!-- Ссылка возврата на главную -->
        <a href="/" class="back-link">🏠 На главную</a>
    </div>

    <script>
        /* ============================================================
           ГЛОБАЛЬНОЕ СОСТОЯНИЕ
           ============================================================ */
        let products = [];  // массив товаров, загружается с сервера
        let cart = [];      // массив товаров в корзине: { name, price, quantity }

        /* ============================================================
           ЗАГРУЗКА ТОВАРОВ С СЕРВЕРА
           GET /api/info -> { products: [ { name, price }, ... ] }
           Если API недоступен — используются тестовые данные.
           ============================================================ */
        fetch('/api/info')
            .then(res => res.json())
            .then(data => {
                products = data.products;
                renderProducts();
            })
            .catch(() => {
                // Fallback: тестовые товары, если бэкенд не отвечает
                products = [
                    { name: "Ukey Windows PE", price: 1200 },
                    { name: "Ukey Kali Linux", price: 1500 },
                    { name: "Ukey Windows PE Pro", price: 1800 }
                ];
                renderProducts();
                showNotification('⚠️ Используются тестовые данные', 'error');
            });

        /* ============================================================
           ВСПЛЫВАЮЩЕЕ УВЕДОМЛЕНИЕ
           message — текст, type — 'success' (зелёный) или 'error' (красный).
           Автоматически исчезает через 3 секунды.
           ============================================================ */
        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            document.body.appendChild(notification);

            // Плавное затухание перед удалением
            setTimeout(() => {
                notification.style.opacity = '0';
                notification.style.transition = 'opacity 0.3s';
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }

        /* ============================================================
           МОДАЛЬНОЕ ОКНО QR-КОДА
           ============================================================ */

        // Показать модальное окно с QR-кодом
        function showQrModal(qrUrl, invId) {
            document.getElementById('qrModalImg').src = qrUrl;
            document.getElementById('qrModalInvId').textContent = invId;
            document.getElementById('qrModal').style.display = 'flex';
        }

        // Закрытие по крестику
        document.getElementById('qrModalClose').addEventListener('click', () => {
            document.getElementById('qrModal').style.display = 'none';
        });

        // Закрытие по клику на тёмный фон (не на саму карточку)
        document.getElementById('qrModal').addEventListener('click', (e) => {
            if (e.target.id === 'qrModal') {
                document.getElementById('qrModal').style.display = 'none';
            }
        });

        /* ============================================================
           РЕНДЕР СПИСКА ТОВАРОВ
           Для каждого товара проверяем, есть ли он уже в корзине:
           - если есть -> кнопка disabled, текст «✓ В корзине»
           - если нет  -> кнопка активна, текст «➕ Добавить»
           ============================================================ */
        function renderProducts() {
            const container = document.getElementById('products');
            container.innerHTML = '';

            products.forEach((product, index) => {
                const inCart = cart.some(item => item.name === product.name);

                const div = document.createElement('div');
                div.className = 'product-item';
                div.innerHTML = `
                    <div class="product-info">
                        <span class="product-name">${product.name}</span>
                        <span class="product-price">${product.price.toLocaleString()} ₽</span>
                    </div>
                    <button onclick="addToCart(${index})" ${inCart ? 'disabled style="background:#ccc; cursor:not-allowed;"' : ''}>
                        ${inCart ? '✓ В корзине' : '➕ Добавить'}
                    </button>
                `;
                container.appendChild(div);
            });
        }

        /* ============================================================
           ДОБАВЛЕНИЕ В КОРЗИНУ
           Правило: не больше 1 шт. одной позиции.
           Если товар уже в корзине — показываем уведомление и выходим.
           ============================================================ */
        function addToCart(index) {
            const product = products[index];
            const existing = cart.find(item => item.name === product.name);

            if (existing) {
                showNotification(`⚠️ ${product.name} уже в корзине (макс. 1 шт.)`, 'error');
                return;
            }

            // Добавляем ровно 1 шт.
            cart.push({ ...product, quantity: 1 });

            renderProducts(); // обновить состояние кнопок «Добавить / В корзине»
            renderCart();     // перерисовать корзину
            showNotification(`✅ ${product.name} добавлен в корзину`);
        }

        /* ============================================================
           РЕНДЕР КОРЗИНЫ
           Каждый товар: название, цена, надпись «1 шт.», кнопка «Удалить».
           Внизу — итоговая сумма.
           ============================================================ */
        function renderCart() {
            const container = document.getElementById('cart');
            const totalContainer = document.getElementById('total');

            // Если корзина пуста — заглушка
            if (cart.length === 0) {
                container.innerHTML = '<p class="cart-empty">Корзина пуста</p>';
                totalContainer.textContent = 'Итого: 0 ₽';
                return;
            }

            container.innerHTML = '';
            let total = 0;

            cart.forEach((item, index) => {
                const itemTotal = parseInt(item.price) * item.quantity;
                total += itemTotal;

                const div = document.createElement('div');
                div.className = 'cart-item';
                div.innerHTML = `
                    <div class="item-info">
                        <span class="item-name">${item.name}</span>
                        <span class="item-price">${itemTotal.toLocaleString()} ₽</span>
                    </div>
                    <div class="item-quantity">
                        <span style="color:#888; font-weight:normal;">1 шт.</span>
                        <button class="remove-btn" onclick="removeFromCart(${index})">✕ Удалить</button>
                    </div>
                `;
                container.appendChild(div);
            });

            totalContainer.textContent = `Итого: ${total.toLocaleString()} ₽`;
        }

        /* ============================================================
           УДАЛЕНИЕ ИЗ КОРЗИНЫ
           После удаления нужно перерисовать и товары (кнопка снова
           станет активной), и корзину.
           ============================================================ */
        function removeFromCart(index) {
            const name = cart[index].name;
            cart.splice(index, 1);

            renderProducts(); // вернуть кнопку «Добавить» у товара
            renderCart();
            showNotification(`🗑️ ${name} удален из корзины`);
        }

        /* ============================================================
           ОЧИСТКА КОРЗИНЫ
           Удаляет все товары и обновляет интерфейс.
           ============================================================ */
        function clearCart() {
            if (cart.length === 0) return; // нечего очищать
            cart = [];
            renderProducts();
            renderCart();
            showNotification('🗑️ Корзина очищена');
        }

        /* ============================================================
           ОТПРАВКА ЗАКАЗА НА СЕРВЕР
           POST /api/order с телом:
           { name, email, phone, comment, cart: [...], total }
           Ожидаемый ответ: { message, invId, qrUrl }
           ============================================================ */
        document.getElementById('orderForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // не перезагружать страницу

            // Проверка 1: корзина не пуста
            if (cart.length === 0) {
                showNotification('❌ Корзина пуста! Добавьте товары.', 'error');
                return;
            }

            // Собираем данные из формы
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const comment = document.getElementById('comment').value.trim();

            // Проверка 2: обязательные поля заполнены
            if (!name || !email || !phone) {
                showNotification('❌ Заполните все обязательные поля!', 'error');
                return;
            }

            // Считаем итоговую сумму
            const total = cart.reduce((sum, item) => sum + parseInt(item.price) * item.quantity, 0);

            // Формируем тело запроса
            const orderData = {
                name,
                email,
                phone,
                comment,
                cart: cart.map(item => ({
                    name: item.name,
                    price: item.price,
                    quantity: item.quantity
                })),
                total
            };

            // Блокируем кнопку на время отправки
            const submitBtn = document.querySelector('.submit-btn');
            submitBtn.textContent = '⏳ Отправка...';
            submitBtn.disabled = true;

            try {
                const response = await fetch('/api/order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });

                const result = await response.json();

                if (response.ok) {
                    // Успех: уведомление, очистка корзины и формы
                    showNotification(`✅ ${result.message || 'Заказ отправлен!'}`, 'success');
                    cart = [];
                    renderProducts();
                    renderCart();
                    document.getElementById('orderForm').reset();

                    // Если сервер вернул QR-код — показываем модальное окно
                    if (result.qrUrl) {
                        showQrModal(result.qrUrl, result.invId);
                    }
                } else {
                    // Сервер вернул ошибку (4xx/5xx)
                    showNotification(`❌ ${result.message || 'Ошибка отправки'}`, 'error');
                }
            } catch (error) {
                // Сетевая ошибка / сервер недоступен
                showNotification('❌ Ошибка соединения с сервером', 'error');
                console.error('Error:', error);
            } finally {
                // В любом случае возвращаем кнопку в исходное состояние
                submitBtn.textContent = '✅ Отправить заказ';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
