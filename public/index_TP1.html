    <script type="text/javascript">
        // Инициализация после загрузки библиотек
        $.curPage = "login.htm";
        var g_lang = "en_US";

        var url = window.location.href;

        if (url.indexOf("tplinklogin.net") >= 0) {
            url = url.replace("tplinklogin.net", "tplinkwifi.net");
            window.location = url;
        }

        var isLocked = false;

        deleteCookie("Authorization");
        if (window.parent != window) {
            var refresh = function(domain, port, frame, page) {
                if ($.local) location.reload(true);
                else {
                    var ret = window.parent.location.href.match(/(https?):\/\/([^:\/]+)(:\d+)?\/?([^?]*)/);
                    window.parent.location.href = ret[1] + "://" + (domain ? domain : ret[2]) + (port ? ":" + port : (ret[3] ? ret[3] : "")) + "/" + (frame ? frame : (ret[4] ? ret[4] : "")) + (page ? "#__" + page.match(/\w+\.htm$/) : "");
                }
            };
            refresh();
        }

        function Base64Encoding(input) {
            var keyStr = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=";
            var output = "";
            var chr1, chr2, chr3, enc1, enc2, enc3, enc4;
            var i = 0;
            input = utf8_encode(input);
            while (i < input.length) {
                chr1 = input.charCodeAt(i++);
                chr2 = input.charCodeAt(i++);
                chr3 = input.charCodeAt(i++);
                enc1 = chr1 >> 2;
                enc2 = ((chr1 & 3) << 4) | (chr2 >> 4);
                enc3 = ((chr2 & 15) << 2) | (chr3 >> 6);
                enc4 = chr3 & 63;

                if (isNaN(chr2)) {
                    enc3 = enc4 = 64;
                } else if (isNaN(chr3)) {
                    enc4 = 64;
                }
                output = output + keyStr.charAt(enc1) + keyStr.charAt(enc2) + keyStr.charAt(enc3) + keyStr.charAt(enc4);
            }
            return output;
        }

        function utf8_encode(string) {
            string = string.replace(/\r\n/g, "\n");
            var utftext = "";
            for (var n = 0; n < string.length; n++) {
                var c = string.charCodeAt(n);
                if (c < 128) {
                    utftext += String.fromCharCode(c);
                } else if ((c > 127) && (c < 2048)) {
                    utftext += String.fromCharCode((c >> 6) | 192);
                    utftext += String.fromCharCode((c & 63) | 128);
                } else {
                    utftext += String.fromCharCode((c >> 12) | 224);
                    utftext += String.fromCharCode(((c >> 6) & 63) | 128);
                    utftext += String.fromCharCode((c & 63) | 128);
                }
            }
            return utftext;
        }

        function onFocusPwd(event) {
            $.removeClass($.id("pwd-tips"), "nd");
            for (var i = 0, len = tipArr.length; i < len; i++) {
                var tip = tipArr[i];
                $.removeClass(tip, "nd");
                $.removeClass(tip, "error");
            }
            $.addClass((event.target || event.srcElement).parentNode, "focus");
            onKeyUpPwd(event);
        }

        function onKeyUpPwd(event) {
            var value = (event.target || event.srcElement).value,
                spaceTip = tipArr[0],
                lengthTip = tipArr[1],
                charTip = tipArr[2];

            checkSpace(value) ? $.addClass(spaceTip, "active") : $.removeClass(spaceTip, "active");
            checkLength(value) ? $.addClass(lengthTip, "active") : $.removeClass(lengthTip, "active");
            checkChar(value) ? $.addClass(charTip, "active") : $.removeClass(charTip, "active");
        }

        function onBlurPwd(event) {
            var tips = tipArr;
            var showBtn = true;
            var btn = $.id("createBtn");

            $.removeClass((event.target || event.srcElement).parentNode, "focus");
            for (var i = 0, len = tips.length; i < len; i++) {
                var tip = tips[i];
                if ($.hasClass(tip, "active")) {
                    $.addClass(tip, "nd");
                } else {
                    showBtn = false;
                    $.addClass(tip, "error");
                }
            }
            showBtn ? $.removeClass(btn, "disabled") : $.addClass(btn, "disabled");
        }

        function checkSpace(value) {
            var re = /[^\x00-\x19\x21-\xff]/;
            if (re.test(value)) return false;
            return true;
        }

        function checkLength(value) {
            if (value.length > 5 && value.length < 33) return true;
            return false;
        }

        function checkChar(value) {
            var patternNum = /[0-9]/g;
            var patternLetter = /[A-Za-z]/g;
            var patternSign = /[\`\~\!\@\#\$\%\^\&\*\(\)\-\=\_\+\[\]\{\}\;\:\'\"\\\|\/\?\.\,\<\>\x20]/g;
            var level = 0;

            if (patternNum.test(value)) level++;
            if (patternLetter.test(value)) level++;
            if (patternSign.test(value)) level++;

            return level > 1;
        }

        function PCWin(event) {
            if (event.keyCode == 13) {
                if (INCLUDE_FORBIDDEN_OLD_PWD) {
                    if (isFirstLogin === "1") {
                        createPwd();
                    } else {
                        PCSubWin();
                    }
                } else {
                    PCSubWin();
                }
            }

            if (event.keyCode == 9) {
                if ($.hasClass(document.getElementById("languageBox"), "nd")) {
                    // Ничего не делаем
                } else {
                    var nextLanguageIndex = (currentLanguageIndex + 1) % languageItemArray.length;
                    selectLanguage(nextLanguageIndex);
                    window.focus();
                }
            }
        }

        function PCSubWin() {
            if (isLocked == true) {
                return;
            }

            var password = $.id("pcPassword").value;
            var userName;
            if (INCLUDE_FORBIDDEN_OLD_PWD) {
                userName = "admin";
            } else {
                userName = $.id("userName").value;
            }

            doLogin(userName, password);
            localStorage.setItem("language", newLanguage);
        }

        function doLogin(userName, password) {
            if (INCLUDE_LOGIN_GDPR_ENCRYPT) {
                $.act(ACT_CGI, "/cgi/getParm");
                $.exe(null, false, 0);
                $.nn = nn;
                $.ee = ee;
                $.seq = seq;

                $.Iencryptor.setSeq($.seq);
                $.Iencryptor.setRSAKey($.nn, $.ee);
                $.Iencryptor.setHash(userName, password);
                $.Iencryptor.genAESKey();

                var tmpcount = {};
                tmpcount.username = userName;
                tmpcount.password = password;

                $.act(ACT_CGI, "/cgi/login", null, null, tmpcount);
                $.newencryptorManager.recordEncryptor();
                if (!$.exe(null, false, 1)) {
                    window.location.reload();
                }
            }
        }

        function createPwd() {
            if (isFirstLogin === "0" || $.hasClass($.id("createBtn"), "disabled")) {
                return;
            }
            var re = /[^\x00-\x19\x21-\xff]/;
            var password = $.id("change-pcPassword").value;
            var confirmPassword = $.id("confirm-pcPassword").value;
            var userName = "admin";

            if (re.test(password)) {
                $.alert(ERR_USER_PWD_HAS_SPACE);
                return false;
            }
            if (password === "") {
                $.alert(ERR_USER_PWD_EMPTY);
                return false;
            }
            if ($.asc(password, true)) {
                $.alert(ERR_USER_PWD_ASCII);
                return false;
            }

            if (password.length > 32) {
                alert(localString[g_lang].CHANGE_PWD_TITLE);
                return false;
            }

            if (password !== confirmPassword) {
                if (g_lang === "en_US") {
                    alert("The Confirm Password does not match the New Password!");
                } else if (g_lang === "ru_RU") {
                    alert("Значение, указанное в поле Подтвердить пароль, не соответствует новому паролю!");
                } else if (g_lang === "uk_UA") {
                    alert("Підтвердження пароля не співпадає з новим паролем!");
                }
                return false;
            }

            if (!checkSpace(password) || !checkLength(password) || !checkChar(password)) {
                return false;
            }

            $.act(ACT_CGI, "/cgi/auth", null, null, {
                name: userName,
                oldPwd: "admin",
                pwd: password
            });
            if (!$.exe(null, null, 0)) {
                doLogin(userName, password);
                localStorage.setItem("language", newLanguage);
            }
        }

        function deleteCookie(name) {
            var LargeExpDate = new Date();
            document.cookie = name + "=; expires=" + LargeExpDate.toGMTString();
        }

        function lockWeb(bLock) {
            $.id("pcPassword").disabled = bLock;
            $.id("pcPassword").blur();
            if (!INCLUDE_FORBIDDEN_OLD_PWD) {
                $.id("userName").disabled = bLock;
                $.id("userName").blur();
            }
        }

        function resize() {
            bodyObj = document.body;
            bodyObj.style["width"] = (document.documentElement.clientWidth < 1000 ? 1000 : document.documentElement.clientWidth) + "px";
        }

        function pageLoad() {
            resize();
            window.onresize = resize;
            var tip = $.id("tip"),
                tipStr = "",
                note = $.id("note");
            var unLi = $.id("unLi");
            var pwLi = $.id("pwLi");
            var pcPassword = $.id("pcPassword");
            if (!INCLUDE_FORBIDDEN_OLD_PWD) {
                var userName = $.id("userName");
            }

            deleteCookie("Authorization");

            try {
                if (modelName) {
                    document.title = modelName;
                    if (localString) {
                        $.id("mnum").innerHTML = localString[g_lang].MODEL_NO + modelName;
                    } else {
                        $.id("mnum").innerHTML = "Model No. " + modelName;
                    }
                }
                if (modelDesc) {
                    $.id("mname").innerHTML = modelDesc;
                }
            } catch (e) {}

            if ((typeof forbidAdminLogin != "undefined") && forbidAdminLogin == 1) {
                if (localString) {
                    $.id("note").innerHTML = localString[g_lang].NOTE;
                    $.id("tip").innerHTML = localString[g_lang].TIP_CONFLICT;
                } else {
                    $.id("note").innerHTML = "NOTE:";
                    $.id("tip").innerHTML = "The router allows only one administrator to login at the same time, please try again later.";
                }

                forbidAdminLogin = 0;
                authTimes = 0;
                if (INCLUDE_FORBIDDEN_OLD_PWD) {
                    pcPassword.focus();
                    pcPassword.select();
                } else {
                    userName.focus();
                    userName.select();
                }
                lockWeb(true);
                return;
            }

            if ((typeof authTimes != "undefined") && authTimes > 0) {
                if (localString) {
                    $.id("note").innerHTML = localString[g_lang].NOTE;
                    $.id("tip").innerHTML = localString[g_lang].TIP_ERROR;
                } else {
                    $.id("note").innerHTML = "NOTE:";
                    $.id("tip").innerHTML = "The username or password is incorrect, please try again.";
                }
            }

            if ((typeof authTimes != "undefined") && authTimes >= 10) {
                isLocked = true;
                lockWeb(true);

                count = 7200 - forbidTime;
                if (localString) {
                    $.id("note").innerHTML = localString[g_lang].NOTE;
                    tipStr = localString[g_lang].TIP_EXCE1;
                    $.id("tip").innerHTML = tipStr + count + localString[g_lang].TIP_EXCE2;
                } else {
                    $.id("note").innerHTML = "NOTE：";
                    tipStr = "You have exceeded ten attempts. Please try again in ";
                    $.id("tip").innerHTML = tipStr + count + "s.";
                }
                window.setTimeout(function() {
                    if (count < 1) {
                        $.id("note").innerHTML = "";
                        $.id("tip").innerHTML = "";
                        isLocked = false;
                        lockWeb(false);
                        if (INCLUDE_FORBIDDEN_OLD_PWD) {
                            pcPassword.focus();
                        } else {
                            userName.focus();
                        }
                        deleteCookie("Authorization");
                        window.location.reload();
                        return;
                    }
                    count--;
                    if (localString) {
                        $.id("tip").innerHTML = tipStr + count + localString[g_lang].TIP_EXCE2;
                    } else {
                        $.id("tip").innerHTML = tipStr + count + "s.";
                    }
                    window.setTimeout(arguments.callee, 1000);
                }, 1000);
            } else {
                if (navigator.appName == "Microsoft Internet Explorer" && navigator.appVersion.split(";")[1].replace(/[ ]/g, "") != "MSIE8.0") pcPassword.focus();
            }

            if (INCLUDE_FORBIDDEN_OLD_PWD) {
                pcPassword.focus();
                pcPassword.select();
            } else {
                if (navigator.appName == "Microsoft Internet Explorer" && navigator.appVersion.split(";")[1].replace(/[ ]/g, "") != "MSIE8.0") userName.focus();
                userName.select();
            }
        }

        function toggleEye(event) {
            var eyeIcon = event.target || event.srcElement;
            var ele = eyeIcon.previousSibling;
            var type = ele.getAttribute("type");
            if (type === "text") {
                ele.setAttribute("type", "password");
                $.removeClass(eyeIcon, "show");
            } else {
                ele.setAttribute("type", "text");
                $.addClass(eyeIcon, "show");
            }
        }
    </script>

    <script type="text/javascript">
        // Функции для работы с языками
        function hasClass(elem, className) {
            var re = new RegExp(className);
            return elem && re.test(elem.className);
        }

        function addClass(elem, className) {
            if (elem && !hasClass(elem, className)) {
                elem.className += (elem.className ? " " : "") + className;
            }
            return elem;
        }

        function remClass(elem, className) {
            if (elem && hasClass(elem, className)) {
                elem.className = elem.className.replace(className, "");
                elem.className = elem.className.replace(/\s+/, " ");
            }
            return elem;
        }

        function updateTopDesc(language) {
            if (typeof modelName != "undefined" && modelName) {
                if (localString) {
                    $.id("mnum").innerHTML = localString[language].MODEL_NO + modelName;
                } else {
                    $.id("mnum").innerHTML = "Model No. " + modelName;
                }
            }
        }

        function getClassName(clsName) {
            var oParent = document;
            var elements = oParent.getElementsByTagName("*");
            var ele = [];
            for (var i = 0; i < elements.length; i++) {
                if (elements[i].className.indexOf(clsName) > -1) {
                    ele.push(elements[i]);
                }
            }
            return ele;
        }

        function updateText(language) {
            var textElements = document.getElementsByClassName ? document.getElementsByClassName('mtext') : getClassName('mtext');
            var currentLanguageString = localString[language];
            var len = textElements.length;
            var e;
            for (var i = 0; i < len; i++) {
                e = textElements[i];
                for (var t in currentLanguageString) {
                    if (hasClass(e, t)) {
                        if (hasClass(e, 'mph')) {
                            e.placeholder = currentLanguageString[t];
                        } else if (e.value != undefined) {
                            e.value = currentLanguageString[t];
                        } else {
                            e.innerHTML = currentLanguageString[t];
                        }
                        break;
                    }
                }
            }
            updateTopDesc(language);
        }

        function selectLanguage(selectedIndex) {
            var languageSelectBox = document.getElementById("languageUL");
            languageSelectBox.selectedIndex = selectedIndex;

            var languageItems = document.getElementsByClassName ? document.getElementsByClassName("lang_item") : getClassName('lang_item');
            var len = languageItems.length;
            for (var i = 0; i < len; i++) {
                if (i == selectedIndex) {
                    addClass(languageItems[i], 'cur_lang');
                } else {
                    remClass(languageItems[i], 'cur_lang');
                }
            }
            currentLanguageIndex = selectedIndex;
            newLanguage = languageItemArray[selectedIndex];
            g_lang = newLanguage;
            updateText(newLanguage);
            $.country = newLanguage;
            document.getElementById("qrFrame").src = "../qr.htm";
        }

        function createLanguageBox() {
            var languageArray = supportedLanguages.split(",");
            var len = languageArray.length;
            var languageSelectBox = document.getElementById("languageUL");
            var selectedLanguageIndex = 0;
            languageSelectBox.innerHTML = "";
            for (var i = 0; i < len; i++) {
                language = languageArray[i].replace(/(^\s*)|(\s*$)/g, "");
                if (language.match(/\S+/)) {
                    languageItemArray.push(language);
                    languageSelectBox.innerHTML += "<li class='lang_item' onclick='selectLanguage(" + i + ");' tabindex=" + i + "><span>" + localLanguageName[language] + "</span></li>";
                    if (language == oldLanguage) {
                        selectedLanguageIndex = i;
                    }
                }
            }
            selectLanguage(selectedLanguageIndex);
        }
