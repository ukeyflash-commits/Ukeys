<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница не найдена</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
        }
        .error-image {
            width: 100%;
            max-width: 400px;
            height: auto;
            margin-bottom: 30px;
            filter: drop-shadow(0 10px 30px rgba(0,0,0,0.5));
        }
        h1 {
            font-size: 72px;
            font-weight: 900;
            background: linear-gradient(45deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        h2 {
            font-size: 28px;
            margin-bottom: 15px;
            font-weight: 300;
        }
        p {
            font-size: 18px;
            opacity: 0.8;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            padding: 14px 40px;
            background: linear-gradient(45deg, #f7971e, #ffd200);
            color: #1a1a2e;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 16px;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 15px rgba(247, 151, 30, 0.4);
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(247, 151, 30, 0.6);
        }
        .emoji-big {
            font-size: 100px;
            display: block;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Ссылка на картинку — замените на свою -->
        <img src="404.jpg" alt="404 illustration" class="error-image" onerror="this.style.display='none'">
        
        <!-- Если картинка не загрузилась, показываем эмодзи -->
        <span class="emoji-big">🔑 </span>
        
        <h1>404</h1>
        <h2>Ничего здесь не нашел!Звоните Ильдару</h2>
        <p>Страница, которую вы ищете может быть еще мною не создана, перемещена, удалена или никогда не существовала.</p>
        <a href="/" class="btn">Вернуться на главную</a>
    </div>
</body>
</html>
